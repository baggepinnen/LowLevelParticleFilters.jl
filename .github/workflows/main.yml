name: CI
on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          file: ./lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  test-reactant:
    # ReactantParticleFilter on the CPU backend of Reactant. Reactant is not a test dependency of the
    # package, it is added to a temporary environment for this job only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Test ReactantParticleFilter
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.develop(path = ".")
            Pkg.add(["Reactant", "Test", "StaticArrays", "Statistics", "LinearAlgebra", "Random"])
            include("test/test_reactant.jl")'
